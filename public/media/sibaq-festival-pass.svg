<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 540 340"><defs><style>@keyframes pas-ticket-float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(-1.5deg)}}@keyframes pas-sheen-sweep{0%{transform:translateX(-150px) rotate(30deg);opacity:0}25%{opacity:.6}60%{transform:translateX(200px) rotate(30deg);opacity:0}}@keyframes pas-star-twinkle{0%{transform:scale(1) rotate(0deg);opacity:.8}50%{transform:scale(1.3) rotate(30deg);opacity:1;filter:drop-shadow(0 0 8px #ffc928)}}.anim-pas-ticket{animation:pas-ticket-float 4.2s ease-in-out infinite;transform-origin:center center}.anim-pas-sheen{animation:pas-sheen-sweep 5s ease-in-out infinite}.anim-pas-star{animation:pas-star-twinkle 2.8s ease-in-out infinite;transform-origin:center center}@media (prefers-reduced-motion:reduce){.anim-pas-sheen,.anim-pas-star,.anim-pas-ticket{animation:none!important;transform:none!important}}</style><linearGradient id="pasBodyGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#E52B2B"/><stop offset="50%" stop-color="#F15A24"/><stop offset="100%" stop-color="#FFC928"/></linearGradient><linearGradient id="pasParchmentStub" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#FFFDF7"/><stop offset="100%" stop-color="#FFF8E8"/></linearGradient><filter id="pasShadow" width="120%" height="125%" x="-10%" y="-10%"><feDropShadow dx="0" dy="12" flood-color="#191919" flood-opacity=".22" stdDeviation="14"/></filter></defs><g id="festival-ticket-body" class="anim-pas-ticket" filter="url(#pasShadow)"><path fill="url(#pasBodyGrad)" stroke="#191919" stroke-linejoin="round" stroke-width="4" d="M 90,60 L 450,60 C 465,60 475,70 475,85 L 475,145 C 455,145 440,158 440,170 C 440,182 455,195 475,195 L 475,255 C 475,270 465,280 450,280 L 90,280 C 75,280 65,270 65,255 L 65,195 C 85,195 100,182 100,170 C 100,158 85,145 65,145 L 65,85 C 65,70 75,60 90,60 Z"/><path fill="url(#pasParchmentStub)" stroke="#191919" stroke-width="2.5" d