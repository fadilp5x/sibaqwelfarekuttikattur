<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 600 400"><defs><style>@keyframes cal-stroke-draw{0%{stroke-dashoffset:1200;opacity:.2}15%{opacity:1}70%{stroke-dashoffset:0;opacity:1}}@keyframes cal-pen-sweep{0%{transform:translate(-40px,30px) rotate(-15deg);opacity:0}15%{opacity:1}65%{transform:translate(320px,-45px) rotate(12deg);opacity:1}80%{transform:translate(340px,-60px) rotate(0deg);opacity:.85}}@keyframes cal-nuqta-pop{0%,55%{transform:scale(0);opacity:0}70%{transform:scale(1.25);opacity:1}80%{transform:scale(1);opacity:1}}@keyframes cal-arabesque-bloom{0%,65%{transform:scale(.6) rotate(-20deg);opacity:0}85%{transform:scale(1.08) rotate(5deg);opacity:1;filter:drop-shadow(0 0 8px #ffc928)}}@keyframes cal-spark-twinkle{0%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.3);filter:drop-shadow(0 0 6px #36ad50)}}.anim-cal-stroke{stroke-dasharray:1200;stroke-dashoffset:1200;animation:cal-stroke-draw 4.2s cubic-bezier(.25,1,.5,1) infinite}.anim-cal-pen{animation:cal-pen-sweep 4.2s cubic-bezier(.25,1,.5,1) infinite;transform-origin:160px 220px}.anim-cal-nuqta-1{animation:cal-nuqta-pop 4.2s ease-out infinite;transform-origin:245px 125px}.anim-cal-nuqta-2{animation:cal-nuqta-pop 4.2s ease-out infinite .15s;transform-origin:275px 105px}.anim-cal-arabesque{animation:cal-arabesque-bloom 4.2s cubic-bezier(.34,1.56,.64,1) infinite;transform-origin:470px 180px}.anim-cal-spark{animation:cal-spark-twinkle 2.5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.anim-cal-arabesque,.anim-cal-nuqta-1,.anim-cal-nuqta-2,.anim-cal-pen,.anim-cal-spark,.anim-cal-stroke{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><linearGradient id="calStrokeGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#E52B2B"/><stop offset="35%" stop-color="#F15A24"/><stop offset="70%" stop-color="#FFC928"/><stop offset="100%" stop-color="#36AD50"/></linearGradient><linearGradient id="calQalamGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#A7612E"/><stop offset="50%" stop-color="#783D16"/><stop offset="100%" stop-color="#4E230B"/></linearGradient><filter id="calGlowFilter" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="4" flood-color="#FFC928" flood-opacity=".25" stdDeviation="6"/></filter></defs><ellipse cx="300" cy="200" fill="#FFC928" opacity=".06" rx="220" ry="120"/><g id="calligraphy-flowing-strokes" filter="url(#calGlowFilter)"><path stroke="url(#calStrokeGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="14" d="M 70,250 C 130,280 200,240 250,180 C 310,110 380,120 420,180 C 455,230 500,210 530,170" class="anim-cal-stroke"/><path stroke="#FFC928" stroke-linecap="round" stroke-width="4.5" d="M 120,220 C 190,160 280,260 360,200 C 410,160 460,180 500,220" class="anim-cal-stroke" opacity=".8"/></g><g id="calligraphy-nuqta-dots"><g class="anim-cal-nuqta-1"><polygon fill="#36AD50" stroke="#191919" stroke-width="2" points="245 115 255 125 245 135 235 125"/><circle cx="245" cy="125" r="2" fill="#FFF"/></g><g class="anim-cal-nuqta-2"><polygon fill="#FFC928" stroke="#191919" stroke-width="2" points="275 95 285 105 275 115 265 105"/><circle cx="275" cy="105" r="2" fill="#FFF"/></g></g><g id="calligraphy-arabesque-bloom" class="anim-cal-arabesque"><path fill="none" stroke="#36AD50" stroke-linecap="round" stroke-width="4" d="M 470,180 C 490,140 540,140 550,180 C 560,220 510,230 490,200 C 475,180 495,160 515,175 C 525,185 520,200 505,195"/><circle cx="550" cy="180" r="5" fill="#FFC928"/><polygon fill="#E52B2B" points="530 150 535 155 530 160 525 155"/></g><g id="calligraphy-reed-qalam" class="anim-cal-pen"><path fill="url(#calQalamGrad)" stroke="#191919" stroke-width="2" d="M 160,220 L 110,130 C 105,120 115,110 125,115 L 180,205 Z"/><polygon fill="#FFC928" stroke="#191919" stroke-width="1.8" points="160 220 172 212 165 228"/><line x1="135" x2="162" y1="165" y2="218" stroke="#191919" stroke-width="1.5"/><circle cx="166" cy="225" r="3.5" fill="#E52B2B"/></g><g id="calligraphy-ambient-sparkles"><polygon fill="#FFC928" points="110 160 114 164 110 168 106 164" class="anim-cal-spark"/><polygon fill="#36AD50" points="380 95 385 100 380 105 375 100" class="anim-cal-spark"/><polygon fill="#F15A24" points="440 260 444 264 440 268 436 264" class="anim-cal-spark"/></g></svg>