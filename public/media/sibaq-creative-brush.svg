<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 580 380"><defs><style>@keyframes bru-brush-sweep{0%{transform:translate(0,0) rotate(0deg)}35%{transform:translate(90px,-40px) rotate(16deg)}70%{transform:translate(175px,-15px) rotate(28deg)}}@keyframes bru-stroke-reveal{0%{stroke-dashoffset:800;opacity:.3}40%{opacity:1}80%{stroke-dashoffset:0;opacity:1}}@keyframes bru-droplet-float{0%{transform:translateY(0) scale(.9)}50%{transform:translateY(-12px) scale(1.15);filter:drop-shadow(0 0 6px #f15a24)}}.anim-bru-brush{animation:bru-brush-sweep 4.6s ease-in-out infinite;transform-origin:120px 240px}.anim-bru-stroke{stroke-dasharray:800;stroke-dashoffset:800;animation:bru-stroke-reveal 4.6s ease-in-out infinite}.anim-bru-drop-1{animation:bru-droplet-float 2.8s ease-in-out infinite}.anim-bru-drop-2{animation:bru-droplet-float 3.2s ease-in-out infinite .6s}@media (prefers-reduced-motion:reduce){.anim-bru-brush,.anim-bru-drop-1,.anim-bru-drop-2,.anim-bru-stroke{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><linearGradient id="bruPaintGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#E52B2B"/><stop offset="35%" stop-color="#F15A24"/><stop offset="70%" stop-color="#FFC928"/><stop offset="100%" stop-color="#36AD50"/></linearGradient><linearGradient id="bruHandleGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#D97736"/><stop offset="60%" stop-color="#9C4410"/><stop offset="100%" stop-color="#6E2B06"/></linearGradient><filter id="bruShadow" width="125%" height="125%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#191919" flood-opacity=".16" stdDeviation="10"/></filter></defs><g id="creative-brush-paint-trail" filter="url(#bruShadow)"><path stroke="url(#bruPaintGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="26" d="M 60,250 C 130,290 220,240 310,180 C 390,130 460,150 510,180" class="anim-bru-stroke"/><path stroke="#FFF8E8" stroke-linecap="round" stroke-width="6" d="M 90,245 C 160,280 240,230 320,175 C 390,130 450,145 490,170" class="anim-bru-stroke" opacity=".65"/></g><g id="creative-brush-droplets"><circle cx="160" cy="285" r="5" fill="#E52B2B" class="anim-bru-drop-1"/><circle cx="185" cy="305" r="3.5" fill="#F15A24" class="anim-bru-drop-2"/><circle cx="340" cy="140" r="4.5" fill="#FFC928" class="anim-bru-drop-1"/><circle cx="430" cy="115" r="4" fill="#36AD50" class="anim-bru-drop-2"/></g><g id="creative-brush-tool" class="anim-bru-brush" filter="url(#bruShadow)"><path fill="url(#bruHandleGrad)" stroke="#191919" stroke-width="3" d="M 65,290 L 195,160 C 200,155 208,155 212,160 L 222,170 C 226,174 226,182 221,187 L 90,315 C 80,325 60,310 65,290 Z"/><polygon fill="#E2E8F0" stroke="#191919" stroke-width="2.5" points="195 160 220 135 242 157 217 182"/><line x1="205" x2="227" y1="150" y2="172" stroke="#94A3B8" stroke-width="1.8"/><path fill="#36AD50" stroke="#191919" stroke-linejoin="round" stroke-width="2.5" d="M 220,135 C 235,120 260,110 275,125 C 290,140 280,165 265,180 L 242,157 Z"/><path fill="#FFC928" d="M 245,115 C 265,115 275,125 270,145 Z"/><circle cx="270" cy="128" r="4" fill="#F15A24"/></g><polygon fill="#FFC928" points="140 110 145 115 140 120 135 115"/><polygon fill="#E52B2B" points="480 90 486 96 480 102 474 96"/><polygon fill="#36AD50" points="380 250 385 255 380 260 375 255"/></svg>