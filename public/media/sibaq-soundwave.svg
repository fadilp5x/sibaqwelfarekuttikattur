<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 580 320"><defs><style>@keyframes wav-bar-bounce-1{0%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes wav-bar-bounce-2{0%{transform:scaleY(.85)}50%{transform:scaleY(.25)}}@keyframes wav-bar-bounce-3{0%{transform:scaleY(.45)}50%{transform:scaleY(.95)}}@keyframes wav-wave-undulate{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes wav-pulse-glow{0%{opacity:.6;filter:drop-shadow(0 0 3px #ffc928)}50%{opacity:1;filter:drop-shadow(0 0 10px #ffc928)}}.anim-wav-1,.anim-wav-2{animation:wav-bar-bounce-1 1.6s ease-in-out infinite;transform-origin:center bottom}.anim-wav-2{animation:wav-bar-bounce-2 1.4s ease-in-out infinite}.anim-wav-3{animation:wav-bar-bounce-3 1.8s ease-in-out infinite}.anim-wav-3,.anim-wav-4,.anim-wav-5{transform-origin:center bottom}.anim-wav-4{animation:wav-bar-bounce-1 1.5s ease-in-out infinite .3s}.anim-wav-5{animation:wav-bar-bounce-2 1.7s ease-in-out infinite .2s}.anim-wav-sine{animation:wav-wave-undulate 3.2s ease-in-out infinite}.anim-wav-glow{animation:wav-pulse-glow 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.anim-wav-1,.anim-wav-2,.anim-wav-3,.anim-wav-4,.anim-wav-5,.anim-wav-glow,.anim-wav-sine{animation:none!important;transform:none!important}}</style><linearGradient id="wavGradRed" x1="0" x2="0" y1="1" y2="0"><stop offset="0%" stop-color="#E52B2B"/><stop offset="100%" stop-color="#FF5A5A"/></linearGradient><linearGradient id="wavGradOrange" x1="0" x2="0" y1="1" y2="0"><stop offset="0%" stop-color="#F15A24"/><stop offset="100%" stop-color="#FFA07A"/></linearGradient><linearGradient id="wavGradYellow" x1="0" x2="0" y1="1" y2="0"><stop offset="0%" stop-color="#FFC928"/><stop offset="100%" stop-color="#FFE885"/></linearGradient><linearGradient id="wavGradGreen" x1="0" x2="0" y1="1" y2="0"><stop offset="0%" stop-color="#36AD50"/><stop offset="100%" stop-color="#62D87B"/></linearGradient><filter id="wavShadow"