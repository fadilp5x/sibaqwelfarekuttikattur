<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 560 380"><defs><style>@keyframes poe-scroll-unroll{0%{transform:scaleX(.75);opacity:.6}50%{transform:scaleX(1);opacity:1}}@keyframes poe-line-draw{0%,25%{stroke-dashoffset:450;opacity:0}70%{stroke-dashoffset:0;opacity:1}}@keyframes poe-quote-settle{0%,30%{transform:translateY(-15px) scale(.6);opacity:0}60%{transform:translateY(2px) scale(1.15);opacity:1}75%{transform:translateY(0) scale(1);opacity:1}}@keyframes poe-glint-sweep{0%{transform:translateX(-120px) rotate(25deg);opacity:0}35%{opacity:.55}60%{transform:translateX(240px) rotate(25deg);opacity:0}}.anim-poe-scroll{animation:poe-scroll-unroll 4.2s ease-out infinite;transform-origin:center center}.anim-poe-line{stroke-dasharray:450;stroke-dashoffset:450;animation:poe-line-draw 4.2s ease-in-out infinite}.anim-poe-quote-l{animation:poe-quote-settle 4.2s cubic-bezier(.34,1.56,.64,1) infinite;transform-origin:150px 115px}.anim-poe-quote-r{animation:poe-quote-settle 4.2s cubic-bezier(.34,1.56,.64,1) infinite .2s;transform-origin:410px 225px}.anim-poe-glint{animation:poe-glint-sweep 4.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.anim-poe-glint,.anim-poe-line,.anim-poe-quote-l,.anim-poe-quote-r,.anim-poe-scroll{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style><linearGradient id="poeParchmentGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#FFFDF8"/><stop offset="30%" stop-color="#FFF8E8"/><stop offset="80%" stop-color="#F5E8CB"/><stop offset="100%" stop-color="#EAD6B0"/></linearGradient><linearGradient id="poeWoodGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#A7612E"/><stop offset="50%" stop-color="#783D16"/><stop offset="100%" stop-color="#4E230B"/></linearGradient><filter id="poeShadow" width="120%" height="125%" x="-10%" y="-10%"><feDropShadow dx="0" dy="10" flood-color="#191919" flood-opacity=".16" stdDeviation="12