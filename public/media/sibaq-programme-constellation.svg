<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 600 480"><defs><style>@keyframes con-orbit-breathe{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(2deg) scale(1.02)}}@keyframes con-center-pulse{0%{transform:scale(1);filter:drop-shadow(0 0 6px #ffc928)}50%{transform:scale(1.08);filter:drop-shadow(0 0 16px #ffc928) drop-shadow(0 0 20px #f15a24)}}@keyframes con-node-float-1{0%{transform:translate(0,0)}50%{transform:translate(3px,-4px)}}@keyframes con-node-float-2{0%{transform:translate(0,0)}50%{transform:translate(-4px,3px)}}.anim-con-center,.anim-con-orbit{transform-origin:300px 240px}.anim-con-orbit{animation:con-orbit-breathe 8s ease-in-out infinite}.anim-con-center{animation:con-center-pulse 3s ease-in-out infinite}.anim-con-node-odd{animation:con-node-float-1 4s ease-in-out infinite}.anim-con-node-even{animation:con-node-float-2 4.5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.anim-con-center,.anim-con-node-even,.anim-con-node-odd,.anim-con-orbit{animation:none!important}}</style><linearGradient id="conCenterGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#FFE885"/><stop offset="40%" stop-color="#FFC928"/><stop offset="100%" stop-color="#F15A24"/></linearGradient><filter id="conShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#191919" flood-opacity=".18" stdDeviation="8"/></filter></defs><g fill="none" stroke="#FFC928" stroke-dasharray="6 4" stroke-opacity=".25" class="anim-con-orbit"><ellipse cx="300" cy="240" stroke-width="2" rx="210" ry="160"/><ellipse cx="300" cy="240" stroke="#36AD50" stroke-opacity=".2" stroke-width="1.5" rx="140" ry="105"/><line x1="300" x2="300" y1="80" y2="400" stroke-width="1.2"/><line x1="90" x2="510" y1="240" y2="240" stroke-width="1.2"/><line x1="150" x2="450" y1="125" y2="355" stroke-width="1.2"/><line x1="450" x2="150" y1="125" y2="355" stroke-width="1.2"/></g><g id="constellation-core" class="anim-con-center" filter="url(#conShadow)"><polygon fill="url(#conCenterGrad)" stroke="#191919" stroke-linejoin="round" stroke-width="4" points="300 195 345 240 300 285 255 240"/><polygon fill="#E52B2B" stroke="#191919" stroke-width="2" points="300 210 330 240 300 270 270 240"/><circle cx="300" cy="240" r="7" fill="#FFF"/></g><g id="constellation-eight-nodes"><g class="anim-con-node-odd" transform="translate(300, 80)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#FFC928" stroke-width="2.5"/><polygon fill="#36AD50" points="0 -12 8 2 -2 12 -8 2"/><circle cx="0" cy="0" r="2.5" fill="#FFF"/></g><g class="anim-con-node-even" transform="translate(450, 125)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#F15A24" stroke-width="2.5"/><rect width="14" height="10" x="-10" y="-8" fill="#F15A24" rx="3"/><rect width="14" height="10" x="-4" y="-2" fill="#FFC928" rx="3"/></g><g class="anim-con-node-odd" transform="translate(510, 240)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#36AD50" stroke-width="2.5"/><path fill="#36AD50" stroke="#FFF" stroke-width="1.2" d="M -12,-6 C -6,-10 0,-4 0,-4 C 0,-4 6,-10 12,-6 L 12,8 C 6,4 0,10 0,10 C 0,10 -6,4 -12,8 Z"/></g><g class="anim-con-node-even" transform="translate(450, 355)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#E52B2B" stroke-width="2.5"/><path fill="#E52B2B" d="M -10,-8 C 4,-12 12,2 10,10 C 8,14 -4,14 -8,8 Z"/><circle cx="-2" cy="-2" r="2" fill="#FFC928"/><circle cx="4" cy="4" r="2" fill="#36AD50"/></g><g class="anim-con-node-odd" transform="translate(300, 400)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#FFC928" stroke-width="2.5"/><path fill="#FFC928" d="M -10,10 C -6,2 2,-6 10,-10 C 6,-2 -2,6 -10,10 Z"/><line x1="-10" x2="6" y1="10" y2="-6" stroke="#191919" stroke-width="1.5"/></g><g class="anim-con-node-even" transform="translate(150, 355)"><circle cx="0" cy="0" r="26" fill="#191919" stroke="#F15A24" stroke-width="2.5"/><circle cx="0" cy="0" r="10" stroke="#F15A24" stroke-width="3"/><polygon fill="#FF